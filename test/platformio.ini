; PlatformIO Project Configuration File for Tests
;
; Enable running tests in native environment
; This improves development speed by running tests on the development machine
; instead of the target hardware

[env:native]
platform = native
build_flags = 
    -std=gnu++11
    -D UNITY_INCLUDE_DOUBLE
    -D UNITY_DOUBLE_PRECISION=1e-12
    -D UNITY_OUTPUT_COLOR

[env:m5stack-core-esp32-tests]
platform = espressif32
board = m5stack-core-esp32
framework = arduino
lib_deps = 
    m5stack/M5Stack@^0.4.6
    m5stack/M5GFX@^0.2.6
build_flags = 
    -D UNITY_INCLUDE_DOUBLE
    -D UNITY_DOUBLE_PRECISION=1e-12
test_framework = unity
test_ignore = test_native/*
test_filter = test_*
test_build_project_src = yes
